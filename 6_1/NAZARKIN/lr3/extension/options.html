<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>WSB Thread Radar — настройки</title>
  <style>
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           max-width: 560px; margin: 32px auto; padding: 0 18px; color: #202124; }
    h1 { font-size: 20px; }
    label { display: block; margin-top: 18px; font-weight: 600; }
    input { width: 100%; padding: 9px 10px; margin-top: 5px; border: 1px solid #c8ccd2;
            border-radius: 8px; font: inherit; box-sizing: border-box; }
    .hint { color: #5f6368; font-size: 12px; margin-top: 5px; }
    button { margin-top: 22px; padding: 9px 18px; border: 0; border-radius: 8px;
             color: #fff; background: #ff5a12; font: inherit; font-weight: 650; cursor: pointer; }
    #status { margin-left: 12px; color: #188038; }
    code { background: #f1f3f4; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>WSB Thread Radar</h1>
  <p>Расширение работает с двумя локальными сервисами.</p>

  <label for="backendUrl">Backend (поиск и ИС)</label>
  <input id="backendUrl" placeholder="http://127.0.0.1:8000">
  <div class="hint">Запуск: <code>python backend/app.py</code></div>

  <label for="assistantUrl">LLM-сервис (ассистент)</label>
  <input id="assistantUrl" placeholder="http://127.0.0.1:8010">
  <div class="hint">Запуск: <code>python llm_service/app.py</code>. Модель и провайдер задаются в <code>.env</code>.</div>

  <p><button id="save" type="button">Сохранить</button><span id="status"></span></p>
  <p><button id="check" type="button">Проверить соединение</button><span id="checkStatus"></span></p>

  <script src="options.js"></script>
</body>
</html>
