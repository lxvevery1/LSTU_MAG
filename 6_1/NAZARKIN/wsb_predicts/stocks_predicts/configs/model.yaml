# Direction-model configuration.
model:
  encoder_path: ../../chromium_extension/api_model/finbert
  classifier_checkpoint: ../../chromium_extension/api_model/finbert
  max_len: 256
  freeze_layers: 8          # 0 = train the whole encoder; 12 = frozen encoder
  use_ticker_fragment: true
  use_class_probs: true     # stage-1 feature; ablation turns this off
  use_market_features: true
  use_aggregate_features: true
  use_engagement_weight: false
  use_aux_class_loss: true
  use_magnitude_loss: false
  hidden_dim: 128
  dropout: 0.2
  ticker_embedding_dim: 16
  flair_embedding_dim: 8

training:
  seeds: [42, 43, 44]
  primary_seed: 42
  horizons: [1, 3, 5, 10]
  primary_horizon: 5
  batch_size: 8
  grad_accumulation: 4
  epochs: 3
  patience: 2
  encoder_lr: 0.00002
  head_lr: 0.001
  weight_decay: 0.01
  warmup_steps: 80
  max_grad_norm: 1.0
  label_smoothing: 0.05
  focal_gamma: 1.5
  loss_type: weighted_ce
  lambda_class: 0.3
  lambda_magnitude: 0.1
  lambda_l2: 0.0001
  num_workers: 0
  fp16: true
  gradient_checkpointing: true
  device: auto

ablations:
  # Names map to overrides of model.*
  no_influence_weight: {loss_use_influence_weight: false}
  no_ticker_fragment: {use_ticker_fragment: false}
  text_only: {use_market_features: false, use_aggregate_features: false}
  frozen_encoder: {freeze_layers: 12}
  no_aux_loss: {use_aux_class_loss: false}
  no_noise_meme: {drop_noise_meme: true}
  no_class_probs: {use_class_probs: false}
